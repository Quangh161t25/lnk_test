<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dubaonhap</title>
</head>
<body>
    <script>
        window.location.replace('index.html?module=dubaonhap');
    </script>
    <template data-module-fragment="dubaonhap">
<div id="module-dubaonhap" class="hidden h-full flex flex-col bg-slate-50">
    <!-- Top Bar: Title, Search, Stats, Quick Actions -->
    <div class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center font-bold text-lg shrink-0">
                📈
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-800">Dự báo nhập hàng (ROP)</h1>
                <p class="text-xs text-slate-500">Dự báo điểm đặt hàng lại, ngày hết hàng và đề xuất số lượng cần nhập</p>
            </div>
        </div>

        <!-- KPI summary chips -->
        <div class="flex flex-wrap items-center gap-2">
            <div class="px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-200 flex items-center gap-2 text-xs">
                <span class="text-slate-500">Tổng SP:</span>
                <span id="dubaonhapStatTotal" class="font-bold text-slate-800">0</span>
            </div>
            <div class="px-3 py-1.5 rounded-lg bg-rose-50 border border-rose-200 flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                <span class="text-rose-700">Cần đặt ngay:</span>
                <span id="dubaonhapStatUrgent" class="font-bold text-rose-700">0</span>
            </div>
            <div class="px-3 py-1.5 rounded-lg bg-amber-50 border border-amber-200 flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                <span class="text-amber-700">Sắp đến hạn:</span>
                <span id="dubaonhapStatWarning" class="font-bold text-amber-700">0</span>
            </div>
            <div class="px-3 py-1.5 rounded-lg bg-purple-50 border border-purple-200 flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-purple-600"></span>
                <span class="text-purple-700">Tổng cần nhập:</span>
                <span id="dubaonhapStatTotalNeeded" class="font-bold text-purple-700">0</span>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="flex items-center gap-2">
            <button onclick="downloadDubaoNhapExcel()" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 flex items-center gap-1.5 shadow-sm transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Tải Excel dự báo
            </button>
            <button onclick="renderDubaoNhapModule(false, true)" class="px-3 py-2 rounded-lg bg-slate-700 text-white text-xs font-bold hover:bg-slate-800 flex items-center gap-1.5 shadow-sm transition" title="Làm mới lại dữ liệu từ Google Sheets">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Làm mới
            </button>
        </div>
    </div>

    <!-- Filter & Global Settings Bar -->
    <div class="bg-white border-b border-slate-200 px-6 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0">
        <!-- Search & Status filter -->
        <div class="flex flex-wrap items-center gap-2">
            <div class="relative min-w-[220px]">
                <input id="dubaonhapSearchInput" oninput="applyDubaoNhapFilters(true)" placeholder="Tìm mã hoặc tên sản phẩm..."
                    class="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500">
                <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <select id="dubaonhapFilterStatus" onchange="applyDubaoNhapFilters(true)"
                class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500">
                <option value="ALL">Tất cả trạng thái</option>
                <option value="URGENT">🚨 Cần đặt ngay (Hết / Chạm ROP)</option>
                <option value="WARNING">⚠️ Sắp đến hạn đặt (≤ 7 ngày)</option>
                <option value="NEED_ORDER">📦 Có số lượng cần nhập (> 0)</option>
                <option value="SAFE">✅ Tồn kho an toàn</option>
                <option value="OUT_OF_STOCK">❌ Đã hết hàng</option>
            </select>
        </div>

        <!-- Global Fast Setup tools -->
        <div class="flex flex-wrap items-center gap-2 p-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
            <span class="text-slate-500 font-medium px-1">Cài đặt nhanh:</span>
            <div class="flex items-center gap-1">
                <label class="text-slate-600 text-[11px]" title="Thời gian nhà cung cấp giao hàng (Lead Time)">Hàng về:</label>
                <input type="number" id="dubaonhapGlobalLeadTime" value="7" min="0" class="w-14 px-2 py-1 border border-slate-300 rounded text-center text-xs font-semibold bg-white" title="Thời gian nhà cung cấp giao hàng (ngày)">
                <span class="text-slate-400 text-[11px]">ngày</span>
            </div>
            <span class="text-slate-300">|</span>
            <div class="flex items-center gap-1">
                <label class="text-slate-600 text-[11px]" title="Thời gian bán thêm / tồn kho an toàn">Bán thêm:</label>
                <input type="number" id="dubaonhapGlobalBufferDays" value="30" min="0" class="w-14 px-2 py-1 border border-slate-300 rounded text-center text-xs font-semibold bg-white" title="Thời gian bán thêm (ngày)">
                <span class="text-slate-400 text-[11px]">ngày</span>
            </div>
            <button onclick="applyGlobalDubaoNhapDays()" class="px-2.5 py-1 rounded bg-purple-600 hover:bg-purple-700 text-white font-semibold text-[11px] shadow-sm transition" title="Áp dụng thời gian hàng về & bán thêm cho tất cả sản phẩm">
                Áp dụng ngày
            </button>
            <span class="text-slate-300">|</span>
            <!-- Batch Average Calculations -->
            <button onclick="applyDubaoNhapBatchAvg('top3')" class="px-2.5 py-1 rounded bg-amber-500 hover:bg-amber-600 text-white font-semibold text-[11px] shadow-sm transition" title="Tính tốc độ bán trung bình theo top 3 tháng xuất cao nhất cho toàn bộ sản phẩm">
                ⚡ Đặt tất cả = Top 3 tháng
            </button>
            <button onclick="applyDubaoNhapBatchAvg('last12')" class="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold text-[11px] shadow-sm transition" title="Tính tốc độ bán trung bình theo 12 tháng gần nhất cho toàn bộ sản phẩm">
                📅 Đặt tất cả = TB 12 tháng
            </button>
        </div>
    </div>

    <!-- Table content container -->
    <div class="flex-1 min-h-0 overflow-hidden p-6 flex flex-col">
        <!-- Desktop Table -->
        <div class="hidden md:block flex-1 min-h-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10 text-[11px] font-bold text-slate-600 uppercase tracking-wider">
                    <tr>
                        <th class="px-3 py-3 w-12 text-center">STT</th>
                        <th class="px-3 py-3 min-w-[90px] cursor-pointer hover:bg-slate-100" onclick="sortDubaoNhap('id')">
                            Mã SP <span id="dubaonhapSort_id"></span>
                        </th>
                        <th class="px-4 py-3 min-w-[200px] cursor-pointer hover:bg-slate-100" onclick="sortDubaoNhap('ten_sp')">
                            Tên sản phẩm <span id="dubaonhapSort_ten_sp"></span>
                        </th>
                        <th class="px-3 py-3 text-right cursor-pointer hover:bg-slate-100" onclick="sortDubaoNhap('ton_cuoi')">
                            Tồn cuối <span id="dubaonhapSort_ton_cuoi"></span>
                        </th>
                        <th class="px-3 py-3 text-center min-w-[200px]" title="Tốc độ bán trung bình tháng (có thể tự điền hoặc click 📊 để xem chi tiết 3 tháng cao nhất và 12 tháng gần nhất)">
                            <div class="flex items-center justify-center gap-1">
                                <span>Cột Trung Bình</span>
                                <span class="text-[10px] text-purple-600 font-normal">(sp/tháng)</span>
                            </div>
                        </th>
                        <th class="px-3 py-3 text-center min-w-[105px]" title="Thời gian bán thêm / tồn kho an toàn (ngày)">
                            TG Bán Thêm <span class="text-[10px] text-slate-400 font-normal">(ngày)</span>
                        </th>
                        <th class="px-3 py-3 text-center min-w-[105px]" title="Thời gian nhà cung cấp giao hàng (ngày)">
                            TG Hàng Về <span class="text-[10px] text-slate-400 font-normal">(ngày)</span>
                        </th>
                        <th class="px-3 py-3 text-right min-w-[130px] cursor-pointer hover:bg-slate-100 text-purple-700" onclick="sortDubaoNhap('sl_can_nhap')" title="Công thức: trung bình * (TG hàng về + TG bán thêm) - tồn cuối">
                            SL Cần Nhập <span id="dubaonhapSort_sl_can_nhap"></span>
                        </th>
                        <th class="px-3 py-3 text-center min-w-[145px] cursor-pointer hover:bg-slate-100" onclick="sortDubaoNhap('ngay_het_hang')">
                            Ngày Hết Hàng <span id="dubaonhapSort_ngay_het_hang"></span>
                        </th>
                        <th class="px-3 py-3 text-center min-w-[160px] cursor-pointer hover:bg-slate-100" onclick="sortDubaoNhap('ngay_dat_hang')">
                            Ngày Cần Đặt <span id="dubaonhapSort_ngay_dat_hang"></span>
                        </th>
                        <th class="px-3 py-3 text-center w-28">Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="dubaonhapTableBody" class="divide-y divide-slate-100 text-xs">
                    <tr><td colspan="11" class="px-4 py-12 text-center text-slate-400">Đang tải dữ liệu dự báo...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Mobile Cards -->
        <div id="dubaonhapMobileCards" class="md:hidden flex-1 min-h-0 overflow-auto space-y-3"></div>

        <!-- Pagination -->
        <div id="dubaonhapPagination" class="shrink-0 mt-3"></div>
    </div>
</div>

<!-- Modal: Xem chi tiết xuất hàng & chọn phương pháp tính TB -->
<div id="dubaonhapModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        <!-- Modal Header -->
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center font-bold">
                    📊
                </div>
                <div>
                    <h3 id="dubaonhapModalTitle" class="font-bold text-slate-800 text-sm">Chi tiết tốc độ bán sản phẩm</h3>
                    <p id="dubaonhapModalSubtitle" class="text-xs text-slate-500"></p>
                </div>
            </div>
            <button onclick="closeDubaoNhapModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200 transition">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto space-y-5">
            <!-- 3 Options to choose Average -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <!-- Option 1: Top 3 months -->
                <div id="modalOptTop3Card" class="border-2 border-slate-200 rounded-xl p-4 hover:border-purple-400 transition cursor-pointer flex flex-col justify-between bg-white" onclick="selectModalAvgMethod('top3')">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">🏆 Top 3 tháng</span>
                            <input type="radio" name="modalAvgOption" id="modalRadioTop3" class="text-purple-600 focus:ring-purple-500">
                        </div>
                        <p class="text-[11px] text-slate-500 mb-2">TB của 3 tháng có lượng xuất cao nhất ở Danh sách xuất</p>
                        <div class="text-lg font-bold text-slate-800" id="modalTop3AvgValue">0</div>
                        <div class="text-[10px] text-slate-400" id="modalTop3DailyValue">~0 / ngày</div>
                    </div>
                    <div id="modalTop3MonthsList" class="mt-3 text-[11px] text-slate-600 bg-slate-50 p-2 rounded-lg space-y-1"></div>
                </div>

                <!-- Option 2: 12 months average -->
                <div id="modalOptLast12Card" class="border-2 border-slate-200 rounded-xl p-4 hover:border-purple-400 transition cursor-pointer flex flex-col justify-between bg-white" onclick="selectModalAvgMethod('last12')">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md">📅 12 tháng gần nhất</span>
                            <input type="radio" name="modalAvgOption" id="modalRadioLast12" class="text-purple-600 focus:ring-purple-500">
                        </div>
                        <p class="text-[11px] text-slate-500 mb-2">Tổng số lượng xuất 12 tháng qua chia đều cho 12</p>
                        <div class="text-lg font-bold text-slate-800" id="modalLast12AvgValue">0</div>
                        <div class="text-[10px] text-slate-400" id="modalLast12DailyValue">~0 / ngày</div>
                    </div>
                    <div id="modalLast12Details" class="mt-3 text-[11px] text-slate-600 bg-slate-50 p-2 rounded-lg"></div>
                </div>

                <!-- Option 3: Manual input -->
                <div id="modalOptManualCard" class="border-2 border-slate-200 rounded-xl p-4 hover:border-purple-400 transition cursor-pointer flex flex-col justify-between bg-white" onclick="selectModalAvgMethod('manual')">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md">✍️ Tự điền</span>
                            <input type="radio" name="modalAvgOption" id="modalRadioManual" class="text-purple-600 focus:ring-purple-500">
                        </div>
                        <p class="text-[11px] text-slate-500 mb-2">Tự nhập số trung bình dự kiến bán hàng tháng</p>
                        <div class="mt-2">
                            <label class="text-[11px] font-semibold text-slate-700">Mức TB (sp/tháng):</label>
                            <input type="number" id="modalManualInput" oninput="updateModalManualDaily()" class="w-full mt-1 px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-bold text-purple-700 focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500">
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1" id="modalManualDailyValue">~0 / ngày</div>
                    </div>
                </div>
            </div>

            <!-- Full Monthly Breakdown Table -->
            <div>
                <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>Lịch sử xuất hàng theo từng tháng (từ XUAT_CT)</span>
                    <span id="modalExportCount" class="text-[11px] font-normal text-slate-400"></span>
                </h4>
                <div class="border border-slate-200 rounded-xl overflow-hidden max-h-52 overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 text-[11px] text-slate-600 font-semibold">
                            <tr>
                                <th class="px-4 py-2">Tháng</th>
                                <th class="px-4 py-2 text-right">Tổng xuất (sp)</th>
                                <th class="px-4 py-2 text-right">TB ngày (~sp/ngày)</th>
                                <th class="px-4 py-2 text-center">Ghi chú</th>
                            </tr>
                        </thead>
                        <tbody id="modalHistoryTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2 shrink-0">
            <button onclick="closeDubaoNhapModal()" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-100 transition">
                Đóng
            </button>
            <button onclick="saveModalDubaoNhapSelection()" class="px-5 py-2 rounded-lg bg-purple-600 text-white text-xs font-bold hover:bg-purple-700 shadow-sm transition">
                Áp dụng cho sản phẩm này
            </button>
        </div>
    </div>
</div>
</template>
</body>
</html>
